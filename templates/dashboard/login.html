{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — TechCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="glass-panel p-5 w-100 animate-fade-in" style="max-width:420px;">
            <div class="text-center mb-4">
                <div class="service-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
                <h2 class="text-white fw-bold">Admin Login</h2>
                <p class="text-muted small">TechCare Home Services Dashboard</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger glass-alert">Invalid username or password.</div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" name="username" class="form-control glass-input" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" name="password" class="form-control glass-input" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'core:home' %}" class="text-muted small">← Back to website</a>
            </div>
        </div>
    </div>
</body>
</html>

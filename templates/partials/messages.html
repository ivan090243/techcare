{% if messages %}
<div class="container pt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} glass-alert alert-dismissible fade show animate-fade-in" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

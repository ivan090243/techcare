<form method="get" class="search-bar glass-panel p-3 mb-4 animate-fade-in">
    <div class="row g-2 align-items-end">
        <div class="col-md{% if show_category %}{% else %}-12{% endif %}">
            <label class="form-label small text-muted mb-1">Search</label>
            <div class="input-group">
                <span class="input-group-text glass-input-addon"><i class="bi bi-search"></i></span>
                <input type="search" name="q" class="form-control glass-input" placeholder="{{ placeholder|default:'Search...' }}" value="{{ search_query }}">
            </div>
        </div>
        {% if show_category %}
        <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Category</label>
            <select name="category" class="form-select glass-input">
                <option value="">All Categories</option>
                {% for value, label in categories %}
                <option value="{{ value }}" {% if current_category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="col-md-auto">
            <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>
        {% if search_query or current_category %}
        <div class="col-md-auto">
            <a href="{{ clear_url }}" class="btn btn-outline-light w-100">Clear</a>
        </div>
        {% endif %}
    </div>
</form>
